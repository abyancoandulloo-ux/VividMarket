<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VividStore | Modern eCommerce</title>
  <!-- Google Fonts + Font Awesome 6 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fefaf5;
      color: #1a2c3e;
      scroll-behavior: smooth;
    }

    /* lively color palette */
    :root {
      --primary: #ff6b4a;
      --primary-dark: #e35436;
      --primary-light: #ff8a6e;
      --secondary: #42d6c0;
      --secondary-dark: #2baa96;
      --accent: #ffe2b5;
      --dark: #1f2f3c;
      --light-bg: #fff7ef;
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 25px 35px -12px rgba(0, 0, 0, 0.15);
      --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 1.8rem;
    }

    /* ========== HEADER / NAVBAR (with hamburger) ========== */
    header {
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #ffe3d4;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.8rem;
      position: relative;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(130deg, var(--primary), var(--secondary));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .logo i {
      color: var(--primary);
      background: none;
    }

    /* desktop nav links */
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      color: #2c3e50;
      transition: 0.2s;
      font-size: 1rem;
      position: relative;
    }
    .nav-links a:hover {
      color: var(--primary);
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2.5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 4px;
      transition: width 0.25s ease;
    }
    .nav-links a:hover::after {
      width: 100%;
    }

    /* right side icons (cart + menu) */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cart-icon-btn {
      position: relative;
      background: none;
      border: none;
      font-size: 1.7rem;
      cursor: pointer;
      color: #2c3e50;
      transition: transform 0.2s;
      padding: 0.5rem;
      border-radius: 60px;
    }
    .cart-icon-btn:hover {
      transform: scale(1.05);
      color: var(--primary);
    }
    .cart-count {
      position: absolute;
      top: -5px;
      right: -8px;
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.2rem 0.55rem;
      border-radius: 30px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* hamburger menu (mobile) */
    .hamburger {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--primary);
      transition: transform 0.2s;
      background: none;
      border: none;
    }
    .hamburger:hover {
      transform: scale(1.05);
    }

    /* mobile nav links (collapsible) */
    @media (max-width: 880px) {
      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: white;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 1.8rem 1rem;
        box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
        border-top: 2px solid var(--accent);
        display: none;
        z-index: 999;
        transition: 0.3s;
      }
      .nav-links.show {
        display: flex;
        animation: slideDown 0.3s ease;
      }
      .hamburger {
        display: block;
      }
      .navbar {
        padding: 0.9rem 1.2rem;
      }
      .container {
        padding: 0 1rem;
      }
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ========== PRODUCT GRID (enhanced) ========== */
    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 2rem 0 0.5rem;
      text-align: center;
    }
    .section-title span {
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      margin: 2.5rem 0 4rem;
    }
    .product-card {
      background: white;
      border-radius: 1.8rem;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      cursor: default;
      animation: fadeUp 0.5s ease backwards;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: var(--shadow-hover);
    }
    /* badge "new" or "trending" */
    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.8rem;
      border-radius: 40px;
      z-index: 2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .product-img {
      height: 240px;
      background: #fdf0e8;
      overflow: hidden;
      position: relative;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .product-img img {
      transform: scale(1.05);
    }
    .product-info {
      padding: 1.2rem 1rem 1.5rem;
    }
    .product-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }
    .price {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.2rem;
    }
    .rating {
      color: #f4b942;
      font-size: 0.85rem;
      margin: 0.4rem 0;
      letter-spacing: 1px;
    }
    .rating span {
      color: #8b9aaa;
      font-size: 0.75rem;
      margin-left: 4px;
    }
    .add-to-cart-btn {
      width: 100%;
      background: #f2f4f8;
      border: none;
      padding: 0.75rem;
      border-radius: 60px;
      font-weight: 600;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: #2d3e50;
      font-size: 0.9rem;
    }
    .add-to-cart-btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }
    /* loading & empty states */
    .loading-spinner {
      text-align: center;
      padding: 3rem;
      font-size: 1.2rem;
      color: var(--primary);
      grid-column: 1 / -1;
    }

    /* ========== CART DRAWER (unchanged style but improved) ========== */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.25s ease;
    }
    .cart-overlay.open {
      visibility: visible;
      opacity: 1;
    }
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 90%;
      max-width: 450px;
      height: 100%;
      background: white;
      box-shadow: -5px 0 30px rgba(0, 0, 0, 0.2);
      z-index: 1001;
      transition: right 0.3s cubic-bezier(0.2, 0.9, 0.5, 1.1);
      display: flex;
      flex-direction: column;
    }
    .cart-drawer.open {
      right: 0;
    }
    .cart-header {
      padding: 1.5rem;
      border-bottom: 2px solid #ffede3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6b7a8a;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.2rem;
    }
    .cart-item {
      display: flex;
      gap: 1rem;
      background: #fefaf5;
      margin-bottom: 1rem;
      padding: 0.8rem;
      border-radius: 1.2rem;
      align-items: center;
    }
    .cart-item-img {
      width: 65px;
      height: 65px;
      background: #f0e4da;
      border-radius: 16px;
      overflow: hidden;
    }
    .cart-item-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cart-item-details {
      flex: 2;
    }
    .cart-item-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .cart-item-price {
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }
    .qty-btn {
      background: #f0e3db;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .item-qty {
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }
    .remove-item {
      background: none;
      border: none;
      color: #c00;
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 8px;
    }
    .cart-footer {
      padding: 1.2rem;
      border-top: 1px solid #ffe3d6;
      background: white;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .checkout-btn {
      background: linear-gradient(95deg, #25D366, #128C7E);
      border: none;
      width: 100%;
      padding: 0.9rem;
      border-radius: 60px;
      font-weight: 800;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
    }
    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
    }
    .empty-cart-msg {
      text-align: center;
      padding: 3rem 1rem;
      color: #8b9aaa;
    }
    .toast-msg {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2f3c;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 1200;
      backdrop-filter: blur(6px);
      background: rgba(0, 0, 0, 0.85);
      font-size: 0.9rem;
      pointer-events: none;
      animation: fadeInOut 2s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px);}
      15% { opacity: 1; transform: translateX(-50%) translateY(0);}
      85% { opacity: 1;}
      100% { opacity: 0; transform: translateX(-50%) translateY(10px);}
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }

    footer {
      background: #1e2a36;
      color: #cbd5e1;
      text-align: center;
      padding: 2rem;
      margin-top: 2rem;
      font-size: 0.85rem;
      border-radius: 32px 32px 0 0;
    }
    footer a {
      color: var(--secondary);
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">
      <i class="fas fa-store"></i> Vivid<span style="color:#ff6b4a;">Market</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#" id="homeLink">Home</a></li>
      <li><a href="#" id="productsLink">Products</a></li>
      <li><a href="#" id="contactLink">Contact</a></li>
      <li><a href="#" id="offersLink">Offers</a></li>
    </ul>
    <div class="nav-actions">
      <button class="cart-icon-btn" id="cartIconBtn">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="hamburger" id="hamburger">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="section-title"><span>✨ Fresh Picks ✨</span></div>
    <div class="products-grid" id="productsGrid">
      <div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading products...</div>
    </div>
  </div>
</main>

<footer>
  <p><i class="fas fa-store"></i> VividMarket — modern essentials | Free shipping over $50</p>
  <p style="margin-top: 0.5rem;">📞 Orders via WhatsApp <a href="https://wa.me/54227050" target="_blank">+5422 7050</a></p>
  <p style="margin-top: 0.8rem; font-size:0.75rem;">&copy; 2026 VividMarket — All rights reserved.</p>
</footer>

<!-- CART DRAWER & OVERLAY -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3><i class="fas fa-bag-shopping"></i> Your Cart</h3>
    <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
  </div>
  <div class="cart-items" id="cartItemsContainer">
    <div class="empty-cart-msg">🛒 Your cart is empty. Add some cool stuff!</div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display: none;">
    <div class="total-row">
      <span>Total:</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutWhatsappBtn">
      <i class="fab fa-whatsapp"></i> Checkout via WhatsApp
    </button>
    <button id="clearCartBtn" style="background: none; border: none; color:#ff6b4a; margin-top: 12px; width:100%; font-size:0.8rem; cursor:pointer;">Clear cart</button>
  </div>
</div>

<script>
  (function() {
    // Supabase config
    const SUPABASE_URL = 'https://zjfqatxxksjwxfptxouq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZnFhdHh4a3Nqd3hmcHR4b3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDY4OTAsImV4cCI6MjA5NjQ4Mjg5MH0.RNuMP2XDBi1N3fz2NiEKgtf-ngC-52OHAiBH9B8umpU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let products = [];
    let cart = [];

    // Helper: star rating (numeric -> stars)
    function getStarRating(rating) {
      const fullStars = Math.floor(rating);
      const halfStar = (rating % 1) >= 0.5 ? 1 : 0;
      const emptyStars = 5 - fullStars - halfStar;
      return '★'.repeat(fullStars) + (halfStar ? '½' : '') + '☆'.repeat(emptyStars);
    }

    // Cart functions
    function loadCart() {
      const saved = localStorage.getItem('vivid_cart');
      if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; }
      else cart = [];
      updateCartBadge();
      renderCartUI();
    }
    function saveCart() {
      localStorage.setItem('vivid_cart', JSON.stringify(cart));
      updateCartBadge();
      renderCartUI();
    }
    function updateCartBadge() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cartCount');
      if (badge) badge.innerText = totalItems;
    }
    function addToCart(product) {
      const existing = cart.find(item => item.id === product.id);
      if (existing) existing.quantity += 1;
      else cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1, image: product.image_url });
      saveCart();
      showToast(`✨ ${product.name} added to cart!`);
    }
    function updateQuantity(itemId, delta) {
      const index = cart.findIndex(i => i.id === itemId);
      if (index !== -1) {
        const newQty = cart[index].quantity + delta;
        if (newQty <= 0) cart.splice(index, 1);
        else cart[index].quantity = newQty;
        saveCart();
      }
    }
    function removeItem(itemId) {
      cart = cart.filter(i => i.id !== itemId);
      saveCart();
    }
    function clearCart() { cart = []; saveCart(); showToast("Cart cleared 🧹"); }

    // Render products from DB with enhanced style (badge for first 2 products as "trending")
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      if (!products.length) {
        grid.innerHTML = '<div class="loading-spinner">⚠️ No products found. Add some via the manager.</div>';
        return;
      }
      grid.innerHTML = '';
      products.forEach((prod, idx) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.style.animationDelay = `${idx * 0.05}s`;
        // add a "trending" badge for first 3 products (for fun)
        const badgeHtml = (idx < 3) ? `<div class="product-badge"><i class="fas fa-fire"></i> Trending</div>` : '';
        const starDisplay = getStarRating(prod.rating);
        card.innerHTML = `
          ${badgeHtml}
          <div class="product-img">
            <img src="${prod.image_url}" alt="${prod.name}" loading="lazy" onerror="this.src='https://placehold.co/400x300?text=No+Image'">
          </div>
          <div class="product-info">
            <div class="product-title">
              <span>${escapeHtml(prod.name)}</span>
              <span class="price">$${Number(prod.price).toFixed(2)}</span>
            </div>
            <div class="rating">${starDisplay} <span>(${prod.rating})</span></div>
            <button class="add-to-cart-btn" data-id="${prod.id}">
              <i class="fas fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const prodId = btn.getAttribute('data-id');
          const product = products.find(p => p.id == prodId);
          if (product) addToCart(product);
        });
      });
    }

    // Render cart drawer
    function renderCartUI() {
      const container = document.getElementById('cartItemsContainer');
      const footer = document.getElementById('cartFooter');
      if (!container) return;
      if (!cart.length) {
        container.innerHTML = `<div class="empty-cart-msg"><i class="fas fa-box-open"></i> No items yet.<br>Start shopping!</div>`;
        if (footer) footer.style.display = 'none';
        return;
      }
      if (footer) footer.style.display = 'block';
      let itemsHtml = '';
      let total = 0;
      cart.forEach(item => {
        const itemSub = item.price * item.quantity;
        total += itemSub;
        itemsHtml += `
          <div class="cart-item" data-id="${item.id}">
            <div class="cart-item-img"><img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/65x65?text=Img'"></div>
            <div class="cart-item-details">
              <div class="cart-item-name">${escapeHtml(item.name)}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)} each</div>
              <div class="cart-item-actions">
                <button class="qty-btn dec-qty" data-id="${item.id}">-</button>
                <span class="item-qty">${item.quantity}</span>
                <button class="qty-btn inc-qty" data-id="${item.id}">+</button>
                <button class="remove-item" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
              </div>
            </div>
            <div style="font-weight:600;">$${itemSub.toFixed(2)}</div>
          </div>
        `;
      });
      container.innerHTML = itemsHtml;
      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      document.querySelectorAll('.dec-qty').forEach(btn => btn.addEventListener('click', (e) => updateQuantity(btn.getAttribute('data-id'), -1)));
      document.querySelectorAll('.inc-qty').forEach(btn => btn.addEventListener('click', (e) => updateQuantity(btn.getAttribute('data-id'), 1)));
      document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => removeItem(btn.getAttribute('data-id'))));
    }

    function showToast(message) {
      const existing = document.querySelector('.toast-msg');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.innerText = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1900);
    }

    // WhatsApp order
    function generateOrderMessage() {
      if (!cart.length) return null;
      let orderLines = [], grandTotal = 0;
      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        grandTotal += subtotal;
        orderLines.push(`• ${item.name}  x${item.quantity}  → $${subtotal.toFixed(2)} ($${item.price.toFixed(2)} ea)`);
      });
      return `🛍️ *NEW ORDER FROM VIVIDMARKET*%0A${orderLines.join('%0A')}%0A────────────────%0A📦 *TOTAL: $${grandTotal.toFixed(2)}*%0A🙏 Thank you for shopping!%0A%0A📍 Please confirm delivery address & payment method.`;
    }
    function sendWhatsAppOrder() {
      if (!cart.length) { showToast("Cart is empty! Add items before checkout."); return; }
      const message = generateOrderMessage();
      if (!message) return;
      window.open(`https://wa.me/54227050?text=${message}`, '_blank');
      showToast("Redirecting to WhatsApp...");
    }

    // Fetch from Supabase
    async function fetchProductsFromDB() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading products...</div>';
      try {
        const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        products = data || [];
        renderProducts();
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="loading-spinner" style="color:#c00;">⚠️ Error loading products. Please check database or console.</div>`;
        showToast('Failed to fetch products.');
      }
    }

    // ========== NAVBAR TOGGLE (mobile) ==========
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    let menuOpen = false;
    function toggleMenu() {
      navLinks.classList.toggle('show');
      const icon = hamburger.querySelector('i');
      if (navLinks.classList.contains('show')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
      } else {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      }
    }
    hamburger.addEventListener('click', toggleMenu);
    // close menu when clicking a link (for better UX)
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', (e) => {
        if (window.innerWidth <= 880) {
          toggleMenu();
        }
        // smooth scroll for anchor links (dummy behavior)
        e.preventDefault();
        const id = link.getAttribute('id');
        if (id === 'homeLink') window.scrollTo({ top: 0, behavior: 'smooth' });
        else if (id === 'productsLink') document.getElementById('productsGrid')?.scrollIntoView({ behavior: 'smooth' });
        else if (id === 'contactLink') document.querySelector('footer')?.scrollIntoView({ behavior: 'smooth' });
        else if (id === 'offersLink') showToast("🎉 Special offers coming soon!");
      });
    });
    // close menu on window resize above breakpoint
    window.addEventListener('resize', () => {
      if (window.innerWidth > 880 && navLinks.classList.contains('show')) {
        toggleMenu();
      }
    });

    // Cart drawer logic
    const drawer = document.getElementById('cartDrawer');
    const overlay = document.getElementById('cartOverlay');
    const cartIconBtn = document.getElementById('cartIconBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    function openCartDrawer() { drawer.classList.add('open'); overlay.classList.add('open'); renderCartUI(); }
    function closeCartDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
    cartIconBtn.addEventListener('click', openCartDrawer);
    closeCartBtn.addEventListener('click', closeCartDrawer);
    overlay.addEventListener('click', closeCartDrawer);
    document.getElementById('checkoutWhatsappBtn')?.addEventListener('click', sendWhatsAppOrder);
    document.getElementById('clearCartBtn')?.addEventListener('click', () => { if (cart.length && confirm("Clear entire cart?")) clearCart(); });

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Initialization
    fetchProductsFromDB();
    loadCart();
  })();
</script>
</body>
</html>
